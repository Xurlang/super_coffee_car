# =========================================
# 机器人几何参数 (根据 53cm x 42cm 定制)
# =========================================
# 格式: [[x,y], [x,y], ...] 逆时针方向: 左前 -> 右前 -> 右后 -> 左后
# 长0.53(半长0.265), 宽0.42(半宽0.21)。这里稍微给了一点余量(1-2cm)
footprint: [[0.28, 0.22], [0.28, -0.22], [-0.28, -0.22], [-0.28, 0.22]]

# =========================================
# 膨胀层参数 (安全策略 - 统一管理)
# =========================================
# 膨胀半径 0.45m > 机器人外接圆半径(约0.35m)，保证安全
inflation_radius: 0.45
# 衰减系数 8.0：数值越大，代价值随距离下降越快，机器人敢于走得离墙更近
cost_scaling_factor: 3.0

map_type: costmap

# =========================================
# 障碍物层参数
# =========================================
obstacle_layer:
  enabled: true
  # 防止冲出地图的关键设置
  track_unknown_space: true 
  
  obstacle_range: 3.0  # 探测范围
  raytrace_range: 3.5  # 清除范围
  
  observation_sources: scan
  scan:
    # ---------------------------------------------
    # 传感器坐标系 (必须与 URDF 一致)
    sensor_frame: mid360_link 
    # ---------------------------------------------
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true