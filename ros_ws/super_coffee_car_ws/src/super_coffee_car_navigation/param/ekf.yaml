# robot_localization (EKF) 配置文件
# (平衡版：既能压制静止噪音，又能让 IMU 主导转向)

frequency: 50.0
sensor_timeout: 0.1
two_d_mode: true
dynamic_process_noise_covariance: true

# --- 坐标系 ---
odom_frame: odom
base_link_frame: base_footprint
world_frame: odom
publish_tf: true

# 最终极简版 EKF 配置
odom0: /odom/wheel
odom0_config:
  [false, false, false,
   false, false, true,   # Yaw (配合差分)
   true,  false, false,  # Vx
   false, false, true,   # VYaw
   false, false, false]
odom0_differential: true

imu0: /imu/data_calibrated  # <--- 订阅去偏后的数据
imu0_config:
  [false, false, false,
   false, false, false,  # Yaw 关！(我们只信角速度，因为现在角速度准了)
   false, false, false,
   true,  true,  true,   # VYaw 开！
   false, false, false]
imu0_differential: false
imu0_relative: true

# 协方差恢复正常
imu0_twist_covariance: [1e-6, 0, 0, 0, 0, 0,
                        0, 1e-6, 0, 0, 0, 0,
                        0, 0, 1e-6, 0, 0, 0,
                        0, 0, 0, 1e-6, 0, 0,
                        0, 0, 0, 0, 1e-6, 0,
                        0, 0, 0, 0, 0, 0.01] # 正常给就行

# 2. IMU 协方差：设为 0.02 (原先是 500.0)
# 作用：恢复对 IMU 的信任，让它主导转向
imu0_pose_covariance: [1e-6, 0, 0, 0, 0, 0,
                       0, 1e-6, 0, 0, 0, 0,
                       0, 0, 1e-6, 0, 0, 0,
                       0, 0, 0, 1e-6, 0, 0,
                       0, 0, 0, 0, 1e-6, 0,
                       0, 0, 0, 0, 0, 1e-6]

imu0_twist_covariance: [1e-6, 0, 0, 0, 0, 0,
                        0, 1e-6, 0, 0, 0, 0,
                        0, 0, 1e-6, 0, 0, 0,
                        0, 0, 0, 1e-6, 0, 0,
                        0, 0, 0, 0, 1e-6, 0,
                        0, 0, 0, 0, 0, 0.02] # <--- 【恢复】让转弯听 IMU 的

# ==========================================
# 过程噪声
# ==========================================
